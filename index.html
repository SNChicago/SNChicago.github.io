<h1>rclone (personal backup app)</h1>
<p>This is a private, single-owner use of the open-source tool <a href="https://rclone.org/">rclone</a>. It copies the owner's own music project files from the owner's computer to the owner's own Google Drive folder. It has one user, the owner. It is not offered to anyone else.</p>
